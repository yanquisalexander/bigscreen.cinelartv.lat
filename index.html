  <style>
    /* --------------------------------------------------
         Critical base
         -------------------------------------------------- */
    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    html,
    body {
      background: #0a0a0a;
    }

    body {
      overflow: hidden;
    }

    /* --------------------------------------------------
       Static splash (final frame of animation)
       -------------------------------------------------- */
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
    }

    .loading-logo {
      display: block;
      width: clamp(180px, 32vw, 280px);
      height: auto;
      overflow: visible;
    }

    .loading-logo path {
      fill: #ffffff;
    }

    /* --------------------------------------------------
       Cobalt animation
       -------------------------------------------------- */
    .animation {
      height: 4.5rem;
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      right: 0;
      margin: auto;
      width: 42rem;
      z-index: 9999;
    }

    .circle {
      background-color: #ff0066;
      border-radius: 50%;
      display: none;
      height: 1rem;
      left: 50%;
      margin-left: -.5rem;
      margin-top: -.5rem;
      position: absolute;
      top: 50%;
      transform-origin: center;
      width: 1rem;
    }

    .line {
      border-radius: .1875rem;
      height: .375rem;
      left: 50%;
      margin-left: -.1875rem;
      margin-top: -.1875rem;
      position: absolute;
      top: 50%;
      width: .375rem;
      z-index: 1;
    }

    .track {
      background-color: rgba(255, 255, 255, 0.12);
      height: .375rem;
      left: 7.417rem;
      margin-top: -.1875rem;
      position: absolute;
      top: 50%;
      width: 0;
    }

    .progress {
      height: .375rem;
      left: 0;
      position: absolute;
      top: 0;
      width: 0;
      background: linear-gradient(90deg,
          #ff0066 0%,
          #ff0066 25%,
          #ffcc00 50%,
          #00ff99 75%,
          #0099ff 100%);
    }

    .playhead {
      height: 2rem;
      left: 0;
      margin-top: -1rem;
      position: absolute;
      top: 50%;
    }

    /* --------------------------------------------------
       Wordmark animado
       -------------------------------------------------- */
    .wordmark {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(180px, 32vw, 280px);
      height: auto;
      z-index: 1;
      display: block;
      transform: translate(calc(-50% - 17rem), -50%);
      transform-origin: center;
      overflow: visible;
      opacity: 0;
    }

    .wordmark svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .wordmark svg path {
      fill: #ffffff;
    }

    .wordmark-cover {
      display: none;
    }
  </style>
</head>

  <script type="module" src="/src/main.ts"></script>
  <script>
    (function () {
      'use strict';
      function el(id) {
        var g = document.getElementById(id);
        if (!g) throw Error("Element doesn't exist");
        return g;
      }

      /* ── Low-end / no-rAF detection ───────────────────────── */
      var _canAnimate = (function () {
        if (typeof requestAnimationFrame !== 'function') return false;
        var cores = navigator.hardwareConcurrency || 2;
        var mem = navigator.deviceMemory || 2;
        if (cores <= 2 || mem < 2) return false;
        var probe = document.createElement('div');
        probe.style.cssText = 'transform:translateZ(0);position:absolute;visibility:hidden';
        document.body.appendChild(probe);
        var has3d = getComputedStyle(probe).transform !== 'none';
        document.body.removeChild(probe);
        return has3d;
      })();

      /* Save original root font-size before splash scaling */
      var _origFontSize = getComputedStyle(document.documentElement).fontSize;

      function scaleRoot() {
        var scaled = 17 * Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var minSize = 180 / 16.5;
        document.documentElement.style.fontSize = Math.max(scaled, minSize) + "px";
      }

      function restoreRoot() {
        document.documentElement.style.fontSize = _origFontSize;
      }

      function showStaticAndDispatch() {
        el("animation").style.display = "none";
        el("loading-screen").style.opacity = "1";
        restoreRoot();
        document.dispatchEvent(new CustomEvent("splash:ended"));
      }

      /* If no rAF or low-end → static splash only */
      if (!_canAnimate) {
        setTimeout(showStaticAndDispatch, 0);
        return;
      }

      /* ── Keyframes ─────────────────────────────────────────── */
      var lineAnim = {
        startFrame: 2,
        length: 6,
        widths: [.25, .375, 1, 2.625, 6.375, 14.65],
        colors: ["#ff0066", "#ffcc00", "#00ff99"]
      };

      var lineEl = el("line");

      var wordmarkAnim = {
        startFrame: 36,
        length: 19,
        fadeInFrame: 2,
        positions: [4.943, 5.795, 6.136, 6.341, 6.478, 6.58, 6.648, 6.682, 6.716, 6.716, 6.75, 6.75, 6.75, 6.75, 6.75, 6.75, 6.75, 6.75, 6.75],
        offsets: [0, 9.157, 13.84, 14.894, 15.525, 15.946, 16.209, 16.42, 16.577, 16.682, 16.788, 16.893, 16.946, 16.998, 16.998, 16.998, 16.998, 16.998, 16.998],
        colors: ["#0a0a0a", "#FFF"]
      };

      var wordmarkEl = el("wordmark");

      var progressAnim = {
        startFrame: 8,
        length: 28,
        trackWidths: [28.792, 35.5, 36.625, 37.333, 37.792, 38.125, 38.333, 38.583, 38.75, 38.875, 39, 39.125, 39.208, 39.292, 39.333, 39.333, 39.333, 39.292, 39.25, 39.167, 39.042, 38.875, 38.708, 38.417, 38.042, 36.292, 30.583, 20.292],
        trackOffsets: [0, 3.417, 3.75, 4, 4.125, 4.25, 4.333, 4.417, 4.458, 4.5, 4.542, 4.583, 4.625, 4.625, 4.667, 4.667, 4.667, 4.667, 4.667, 4.667, 4.667, 4.667, 4.667, 4.667, 4.625, 3.958, 1.375, -3.542],
        progressWidths: [0, 3.667, 4.333, 4.625, 4.79, 4.88, 4.94, 4.985, 5.01, 5.03, 5.048, 5.064, 5.078, 5.09, 5.1, 5.109, 5.116, 5.121, 5.124, 5.125, 5.124, 5.12, 5.112, 5.08, 5, 4.375, 1.625, -3.417],
        fillWidths: [.375, 10.75, 15.542, 19.25, 22.208, 24.75, 26.875, 28.708, 30.333, 31.792, 33, 34.083, 35.042, 35.875, 36.625, 37.167, 37.708, 38.083, 38.375, 38.542, 38.625, 38.667, 38.625, 38.417, 38.042, 36.292, 30.583, 20.292]
      };

      var trackEl = el("track"), progressFillEl = el("progress");

      /* ── Animation loop ────────────────────────────────────── */
      var started = null;
      var prevFrame = -1;
      var TOTAL_FRAMES = 110;

      function tick(now) {
        if (started === null) started = now;
        var frame = Math.floor((now - started) / (1000 / 30));

        if (frame !== prevFrame) {
          prevFrame = frame;

          /* Line / separator */
          if (frame >= lineAnim.startFrame && frame < lineAnim.startFrame + lineAnim.length) {
            var idx = frame - lineAnim.startFrame;
            var w = lineAnim.widths[idx];
            var color = lineAnim.colors[Math.floor(idx / 2)];
            lineEl.style.display = "block";
            lineEl.style.width = w + "rem";
            lineEl.style.marginLeft = "-" + w / 2 + "rem";
            lineEl.style.backgroundColor = color;
          } else {
            lineEl.style.display = "none";
          }

          /* Progress bar */
          if (frame >= progressAnim.startFrame && frame < progressAnim.startFrame + progressAnim.length) {
            var pi = frame - progressAnim.startFrame;
            trackEl.style.transform = "translateX(" + -progressAnim.trackOffsets[pi] + "rem)";
            trackEl.style.width = progressAnim.trackWidths[pi] + "rem";
            progressFillEl.style.width = progressAnim.fillWidths[pi] + "rem";
          } else {
            trackEl.style.width = "0";
            progressFillEl.style.width = "0";
          }

          /* Wordmark slide-in */
          if (frame >= wordmarkAnim.startFrame && frame < wordmarkAnim.startFrame + wordmarkAnim.length) {
            var wi = frame - wordmarkAnim.startFrame;
            wordmarkEl.style.opacity = "1";
            wordmarkEl.style.transform = "translate(calc(-50% + " + ((wordmarkAnim.offsets[wi] - wordmarkAnim.offsets[wordmarkAnim.offsets.length - 1]) * 0.6) + "rem), -50%)";
          } else if (frame < wordmarkAnim.startFrame) {
            wordmarkEl.style.opacity = "0";
            wordmarkEl.style.transform = "translate(calc(-50% - 10.1988rem), -50%)";
          }
        }

        if (frame < TOTAL_FRAMES) {
          requestAnimationFrame(tick);
        } else {
          showStaticAndDispatch();
        }
      }

      scaleRoot();
      window.addEventListener("resize", scaleRoot);
      var startupAudio = new Audio('/resources/sounds/ctv_startup.wav');
      startupAudio.volume = 0.6;
      setTimeout(function () {
        startupAudio.play().catch(function () { });
        requestAnimationFrame(tick);
      }, 200);
    })();
  </script>
