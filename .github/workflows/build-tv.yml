name: Build TV App (Cobalt)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cobalt_build_type:
        description: "Cobalt build type"
        required: false
        default: "gold"
        type: choice
        options:
          - debug
          - devel
          - qa
          - gold
      platform:
        description: "Target platform"
        required: false
        default: "android-arm"
        type: choice
        options:
          - android-arm
          - linux-x64x11

env:
  APP_URL: https://bigscreen.cinelartv.lat
  DEPOT_TOOLS_UPDATE: 0
  COBALT_VERSION: "27.lts.1"

jobs:
  build:
    name: Build + Package (${{ matrix.platform }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    strategy:
      matrix:
        platform: [${{ inputs.platform || 'android-arm' }}]
        build_type: [${{ inputs.cobalt_build_type || 'gold' }}]

    env:
      COBALT_PLATFORM: ${{ matrix.platform }}
      COBALT_BUILD_TYPE: ${{ matrix.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version config
        id: versions
        run: |
          COBALT_REF=$(python3 -c "import json; print(json.load(open('cobalt-versions.json'))['cobalt']['ref'])")
          STARBOARD_API=$(python3 -c "import json; print(json.load(open('cobalt-versions.json'))['cobalt']['starboard_api_version'])")
          echo "cobalt_ref=$COBALT_REF" >> "$GITHUB_OUTPUT"
          echo "starboard_api=$STARBOARD_API" >> "$GITHUB_OUTPUT"
          echo "Cobalt: $COBALT_REF | Starboard: $STARBOARD_API | Platform: ${{ matrix.platform }}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python3-dev xz-utils \
            lsb-release file ccache pkg-config \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libgl-dev libegl-dev libgles2-mesa-dev

      # ── Android NDK/SDK (solo para android-arm) ──
      - name: Setup Android SDK + NDK
        if: matrix.platform == 'android-arm'
        run: |
          ANDROID_HOME="${{ runner.workspace }}/android-sdk"
          mkdir -p "$ANDROID_HOME"

          # cmdline-tools
          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -sL "$CMDLINE_URL" -o /tmp/cmdtools.zip
          unzip -qo /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          # Accept licenses + install platform + NDK
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

          NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "Android NDK ready at $NDK_HOME"

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/depot_tools
          key: depot-tools-${{ runner.os }}-${{ env.COBALT_VERSION }}
          restore-keys: |
            depot-tools-${{ runner.os }}-

      - name: Setup depot_tools
        run: |
          DEPOT_PATH="${{ runner.workspace }}/depot_tools"
          if [ ! -d "$DEPOT_PATH" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_PATH"
          fi
          echo "$DEPOT_PATH" >> "$GITHUB_PATH"
          echo "depot_tools ready"

      - name: Create Cobalt working directory
        run: |
          COBALT_WORKDIR="${{ runner.workspace }}/cobalt-build"
          mkdir -p "$COBALT_WORKDIR"
          echo "Cobalt workdir: $COBALT_WORKDIR"

      - name: Initialize Cobalt (gclient config)
        working-directory: ${{ runner.workspace }}/cobalt-build
        run: |
          printf 'solutions = [{\n  "url": "https://github.com/youtube/cobalt.git@%s",\n  "managed": False,\n  "name": "src/cobalt",\n}]\n' "${{ env.COBALT_VERSION }}" > .gclient
          cat .gclient

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.platform }}-

      - name: Sync Cobalt dependencies (gclient sync)
        working-directory: ${{ runner.workspace }}/cobalt-build
        run: |
          gclient sync --no-history --shallow --revision "src/cobalt@${{ env.COBALT_VERSION }}"
        timeout-minutes: 60

      - name: Configure Cobalt build (GN)
        working-directory: ${{ runner.workspace }}/cobalt-build/src/cobalt
        run: |
          GN_ARGS=""
          if [ "${{ matrix.platform }}" = "android-arm" ]; then
            GN_ARGS="target_os=\"android\" target_cpu=\"arm\" android_ndk_root=\"$ANDROID_NDK_HOME\" android_sdk_root=\"$ANDROID_HOME\""
          fi
          python3 cobalt/build/gn.py \
            -p ${{ matrix.platform }} \
            -c ${{ matrix.build_type }} \
            --no-rbe \
            --args="$GN_ARGS"
          echo "GN configuration done"

      - name: Build Cobalt (Ninja)
        working-directory: ${{ runner.workspace }}/cobalt-build/src/cobalt
        run: |
          autoninja -C "out/${{ matrix.platform }}_${{ matrix.build_type }}" cobalt
          echo "Cobalt build done"

      - name: Build Evergreen loader (if enabled)
        working-directory: ${{ runner.workspace }}/cobalt-build/src/cobalt
        run: |
          BUILD_DIR="out/${{ matrix.platform }}_${{ matrix.build_type }}"
          if [ -f "$BUILD_DIR/loader_app" ]; then
            echo "Evergreen loader built: $BUILD_DIR/loader_app"
            ls -lh "$BUILD_DIR/loader_app"
          else
            echo "Loader app not found, building..."
            autoninja -C "$BUILD_DIR" loader_app || echo "loader_app target not available"
          fi

      - name: Verify Cobalt build
        working-directory: ${{ runner.workspace }}/cobalt-build/src/cobalt
        run: |
          BUILD_DIR="out/${{ matrix.platform }}_${{ matrix.build_type }}"
          echo "Build output:"
          ls -lh "$BUILD_DIR/" | head -20

          COBALT_BIN="$BUILD_DIR/cobalt"
          if [ -f "$COBALT_BIN" ]; then
            file "$COBALT_BIN"
            echo "Cobalt binary OK"
          fi

          LOADER="$BUILD_DIR/loader_app"
          if [ -f "$LOADER" ]; then
            file "$LOADER"
            echo "Evergreen loader OK"
          fi

          LIBCOBALT="$BUILD_DIR/libcobalt.so"
          if [ -f "$LIBCOBALT" ]; then
            file "$LIBCOBALT"
            echo "Evergreen libcobalt.so OK"
          fi

      - name: Run NPLB smoke tests
        working-directory: ${{ runner.workspace }}/cobalt-build/src/cobalt
        run: |
          BUILD_DIR="out/${{ matrix.platform }}_${{ matrix.build_type }}"
          if [ -f "$BUILD_DIR/nplb" ]; then
            file "$BUILD_DIR/nplb"
            echo "NPLB tests available (skipping cross-compiled binary)"
          else
            echo "NPLB not found, skipping"
          fi

      - name: Smoke test - verify app reachable
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.APP_URL }}" || true)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Smoke test PASSED: ${{ env.APP_URL }} returns HTTP $HTTP_CODE"
          else
            echo "Smoke test WARNING: ${{ env.APP_URL }} returned HTTP $HTTP_CODE"
          fi

      - name: Package artifact
        run: |
          BUILD_DIR="${{ runner.workspace }}/cobalt-build/src/cobalt/out/${{ matrix.platform }}_${{ matrix.build_type }}"
          PACKAGE_DIR="build/tv/${{ matrix.platform }}"
          mkdir -p "$PACKAGE_DIR"

          # Binario principal
          for f in cobalt loader_app libcobalt.so; do
            cp "$BUILD_DIR/$f" "$PACKAGE_DIR/" 2>/dev/null || true
          done

          # Shared libraries
          cp -r "$BUILD_DIR/"*.so "$PACKAGE_DIR/" 2>/dev/null || true
          cp -r "$BUILD_DIR/"*.apk "$PACKAGE_DIR/" 2>/dev/null || true

          # Manifest
          python3 -c "
          import json, os
          manifest = {
              'platform': '${{ matrix.platform }}',
              'build_type': '${{ matrix.build_type }}',
              'cobalt_version': '${{ env.COBALT_VERSION }}',
              'starboard_api': ${{ steps.versions.outputs.starboard_api }},
              'app_url': '${{ env.APP_URL }}',
              'evergreen': True,
              'build_date': '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
              'commit': '${{ github.sha }}',
              'run': '${{ github.run_number }}'
          }
          with open(os.path.join('$PACKAGE_DIR', 'manifest.json'), 'w') as f:
              json.dump(manifest, f, indent=2)
          "

          # Start script
          if [ "${{ matrix.platform }}" = "android-arm" ]; then
            printf '#!/bin/bash\nset -e\necho "Android TV artifact - push to device via adb"\necho "  adb push . /sdcard/cobalt/"\necho "  adb shell /sdcard/cobalt/loader_app --url=%s"\n' "${{ env.APP_URL }}" > "$PACKAGE_DIR/start.sh"
          else
            printf '#!/bin/bash\nset -e\nSCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"\n"$SCRIPT_DIR/cobalt" --url="%s"\n' "${{ env.APP_URL }}" > "$PACKAGE_DIR/start.sh"
          fi
          chmod +x "$PACKAGE_DIR/start.sh"

          echo "Package:"
          find "$PACKAGE_DIR" -type f
          du -sh "$PACKAGE_DIR"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-app-${{ matrix.platform }}-${{ matrix.build_type }}-${{ github.sha }}
          path: build/tv/${{ matrix.platform }}/
          retention-days: 30
