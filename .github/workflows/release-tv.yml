name: Release TV App (Cobalt)

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "App version (e.g. 1.0.0)"
        required: true
        type: string
      cobalt_build_type:
        description: "Cobalt build type"
        required: false
        default: "gold"
        type: choice
        options:
          - debug
          - devel
          - qa
          - gold
      platform:
        description: "Target platform"
        required: false
        default: "aosp-arm"
        type: choice
        options:
          - aosp-arm
          - aosp-arm64
          - aosp-x86
      notes:
        description: "Release notes"
        required: false
        type: string

  push:
    tags:
      - "tv-v*"

env:
  APP_URL: https://bigscreen.cinelartv.lat
  DEPOT_TOOLS_UPDATE: 0
  COBALT_VERSION: "27.lts.1"

jobs:
  release:
    name: Build + Release
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/tv-v* ]]; then
            APP_VERSION="${GITHUB_REF#refs/tags/tv-v}"
          elif [ -n "${{ inputs.app_version }}" ]; then
            APP_VERSION="${{ inputs.app_version }}"
          else
            APP_VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $APP_VERSION"

      - name: Resolve platform and build type
        id: config
        run: |
          PLATFORM="${{ inputs.platform || 'aosp-arm' }}"
          BUILD_TYPE="${{ inputs.cobalt_build_type || 'gold' }}"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "Platform: $PLATFORM | Build: $BUILD_TYPE"

      - name: Read version config
        id: versions
        run: |
          COBALT_REF=$(python3 -c "import json; print(json.load(open('cobalt-versions.json'))['cobalt']['ref'])")
          STARBOARD_API=$(python3 -c "import json; print(json.load(open('cobalt-versions.json'))['cobalt']['starboard_api_version'])")
          echo "cobalt_ref=$COBALT_REF" >> "$GITHUB_OUTPUT"
          echo "starboard_api=$STARBOARD_API" >> "$GITHUB_OUTPUT"
          echo "Cobalt: $COBALT_REF | Starboard: $STARBOARD_API"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python3-dev xz-utils \
            lsb-release file ccache pkg-config \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libgl-dev libegl-dev libgles2-mesa-dev

      - name: Setup Java 17
        if: startsWith(steps.config.outputs.platform, 'aosp-')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK + NDK
        if: startsWith(steps.config.outputs.platform, 'aosp-')
        run: |
          ANDROID_HOME="${{ runner.workspace }}/android-sdk"
          mkdir -p "$ANDROID_HOME"

          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -sL "$CMDLINE_URL" -o /tmp/cmdtools.zip
          unzip -qo /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

          NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "Android NDK ready"

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/depot_tools
          key: depot-tools-${{ runner.os }}-${{ env.COBALT_VERSION }}
          restore-keys: |
            depot-tools-${{ runner.os }}-

      - name: Setup depot_tools
        run: |
          DEPOT_PATH="${{ runner.workspace }}/depot_tools"
          if [ ! -d "$DEPOT_PATH" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_PATH"
          fi
          echo "$DEPOT_PATH" >> "$GITHUB_PATH"
          echo "depot_tools ready"

      - name: Create Cobalt working directory
        run: |
          COBALT_WORKDIR="${{ runner.workspace }}/cobalt-build"
          mkdir -p "$COBALT_WORKDIR"
          echo "Cobalt workdir: $COBALT_WORKDIR"

- name: Initialize Cobalt (gclient config)
        working-directory: ${{ runner.workspace }}/cobalt-build
        run: |
          printf 'solutions = [{\n  "url": "https://github.com/youtube/cobalt.git@27.lts.1",\n  "managed": false,\n  "name": "src/cobalt",\n}]\n' > .gclient
          cat .gclient

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-release-${{ runner.os }}-${{ steps.config.outputs.platform }}-${{ github.sha }}
          restore-keys: |
            ccache-release-${{ runner.os }}-${{ steps.config.outputs.platform }}-

      - name: Prepare src directory
        working-directory: ${{ runner.workspace }}/cobalt-build
        run: |
          mkdir -p src/build/config
          touch src/build/config/gclient_args.gni

      - name: Sync Cobalt dependencies (gclient sync)
        working-directory: ${{ runner.workspace }}/cobalt-build
        run: |
          gclient sync --no-history --shallow
        timeout-minutes: 60

      - name: Configure Cobalt build (GN)
        working-directory: ${{ runner.workspace }}/cobalt-build/src/cobalt
        run: |
          PLATFORM="${{ steps.config.outputs.platform }}"
          BUILD_TYPE="${{ steps.config.outputs.build_type }}"
          python3 cobalt/build/gn.py \
            -p "$PLATFORM" \
            -c "$BUILD_TYPE" \
            --no-rbe

      - name: Build Cobalt (Ninja)
        working-directory: ${{ runner.workspace }}/cobalt-build/src/cobalt
        run: |
          PLATFORM="${{ steps.config.outputs.platform }}"
          BUILD_TYPE="${{ steps.config.outputs.build_type }}"
          autoninja -C "out/${PLATFORM}_${BUILD_TYPE}" cobalt_loader

      - name: Verify build
        working-directory: ${{ runner.workspace }}/cobalt-build/src/cobalt
        run: |
          PLATFORM="${{ steps.config.outputs.platform }}"
          BUILD_TYPE="${{ steps.config.outputs.build_type }}"
          BUILD_DIR="out/${PLATFORM}_${BUILD_TYPE}"
          echo "=== Build output ==="
          ls -lh "$BUILD_DIR/"
          echo "=== APKs ==="
          ls -lh "$BUILD_DIR/apks/" 2>/dev/null
          for f in "$BUILD_DIR"/apks/*.apk; do
            [ -f "$f" ] && file "$f" && echo "  -> $(basename $f) OK"
          done

      - name: Smoke test - verify app
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.APP_URL }}" || true)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "PASSED: ${{ env.APP_URL }} -> HTTP $HTTP_CODE"
          else
            echo "WARNING: ${{ env.APP_URL }} -> HTTP $HTTP_CODE"
          fi

      - name: Package artifact
        run: |
          VERSION="${{ steps.version.outputs.app_version }}"
          PLATFORM="${{ steps.config.outputs.platform }}"
          BUILD_TYPE="${{ steps.config.outputs.build_type }}"
          BUILD_DIR="${{ runner.workspace }}/cobalt-build/src/cobalt/out/${PLATFORM}_${BUILD_TYPE}"
          PACKAGE_DIR="build/tv/${PLATFORM}"
          mkdir -p "$PACKAGE_DIR"

          cp -r "$BUILD_DIR/apks/"*.apk "$PACKAGE_DIR/" 2>/dev/null || true
          cp -r "$BUILD_DIR/"*.so "$PACKAGE_DIR/" 2>/dev/null || true

          python3 -c "
          import json, os
          manifest = {
              'app_version': '$VERSION',
              'platform': '$PLATFORM',
              'build_type': '$BUILD_TYPE',
              'cobalt_version': '${{ env.COBALT_VERSION }}',
              'starboard_api': ${{ steps.versions.outputs.starboard_api }},
              'app_url': '${{ env.APP_URL }}',
              'build_date': '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
              'commit': '${{ github.sha }}',
              'release_tag': '${{ github.ref_name }}'
          }
          with open(os.path.join('$PACKAGE_DIR', 'manifest.json'), 'w') as f:
              json.dump(manifest, f, indent=2)
          "

          cat > "$PACKAGE_DIR/start.sh" << 'EOF'
          #!/bin/bash
          set -e
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          APK=$(find "$SCRIPT_DIR" -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          echo "Installing Cobalt APK..."
          adb install -r "$APK"
          echo "Launching with app URL..."
          adb shell am start --esa commandLineArgs "url=https://bigscreen.cinelartv.lat" dev.cobalt.coat/dev.cobalt.app.MainActivity
          echo "Done."
          EOF
          chmod +x "$PACKAGE_DIR/start.sh"

          cd build
          tar -czf "tv-app-${PLATFORM}-${VERSION}.tar.gz" tv/${PLATFORM}/
          echo "Package:"
          ls -lh "tv-app-${PLATFORM}-${VERSION}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-app-${{ steps.config.outputs.platform }}-${{ steps.version.outputs.app_version }}
          path: build/tv/${{ steps.config.outputs.platform }}/
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/tv-v') || inputs.app_version != ''
        uses: softprops/action-gh-release@v2
        with:
          name: "TV App v${{ steps.version.outputs.app_version }} (${{ steps.config.outputs.platform }})"
          tag_name: "tv-v${{ steps.version.outputs.app_version }}"
          body: |
            ## TV App v${{ steps.version.outputs.app_version }}

            **Platform:** ${{ steps.config.outputs.platform }}
            **Cobalt:** ${{ env.COBALT_VERSION }}
            **Starboard API:** ${{ steps.versions.outputs.starboard_api }}
            **Build:** ${{ steps.config.outputs.build_type }}
            **App URL:** ${{ env.APP_URL }}

            ### Installation (Android TV)
            ```bash
            # Install APK
            adb install -r cobalt.apk

            # Launch with app URL
            adb shell am start --esa commandLineArgs "url=${{ env.APP_URL }}" dev.cobalt.coat/dev.cobalt.app.MainActivity
            ```

            ${{ inputs.notes || '' }}
          files: build/tv-app-${{ steps.config.outputs.platform }}-${{ steps.version.outputs.app_version }}.tar.gz
          draft: false
          prerelease: false
