name: Release TV App (Cobalt)

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "App version (e.g. 1.0.0)"
        required: true
        type: string
      cobalt_build_type:
        description: "Cobalt build type"
        required: false
        default: "gold"
        type: choice
        options:
          - debug
          - devel
          - qa
          - gold
      platform:
        description: "Target platform"
        required: false
        default: "aosp-arm"
        type: choice
        options:
          - aosp-arm
          - aosp-arm64
          - aosp-x86
      notes:
        description: "Release notes"
        required: false
        type: string

env:
  APP_URL: https://bigscreen.cinelartv.lat
  COBALT_PACKAGE: com.abstudios.cinelar.mediaclient

jobs:
  release:
    name: Build + Release
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.app_version }}" ]; then
            APP_VERSION="${{ inputs.app_version }}"
          else
            APP_VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $APP_VERSION"

      - name: Resolve config
        id: config
        run: |
          PLATFORM="${{ inputs.platform || 'aosp-arm' }}"
          BUILD_TYPE="${{ inputs.cobalt_build_type || 'gold' }}"
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "Platform: $PLATFORM | Build: $BUILD_TYPE"

      - name: Read version config
        id: versions
        run: |
          COBALT_REF=$(python3 -c "import json; print(json.load(open('cobalt-versions.json'))['cobalt']['ref'])")
          STARBOARD_API=$(python3 -c "import json; print(json.load(open('cobalt-versions.json'))['cobalt']['starboard_api_version'])")
          echo "cobalt_ref=$COBALT_REF" >> "$GITHUB_OUTPUT"
          echo "starboard_api=$STARBOARD_API" >> "$GITHUB_OUTPUT"
          echo "Cobalt: $COBALT_REF | Starboard: $STARBOARD_API"

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/depot_tools
          key: depot-tools-${{ runner.os }}-${{ steps.versions.outputs.cobalt_ref }}
          restore-keys: |
            depot-tools-${{ runner.os }}-

      - name: Setup depot_tools
        run: |
          DEPOT_PATH="${{ runner.workspace }}/depot_tools"
          if [ ! -d "$DEPOT_PATH" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_PATH"
          fi
          echo "$DEPOT_PATH" >> "$GITHUB_PATH"
          "$DEPOT_PATH/ensure_bootstrap"

      - name: Cache Android SDK + NDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/android-sdk
          key: android-sdk-${{ runner.os }}-ndk26.1
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Setup Android SDK + NDK
        run: |
          ANDROID_HOME="${{ runner.workspace }}/android-sdk"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "Android SDK already present, skipping download"
          else
            mkdir -p "$ANDROID_HOME"
            curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            unzip -qo /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_HOME" >> "$GITHUB_ENV"

      - name: Cache Cobalt source
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.workspace }}/cobalt-build/src
            !${{ runner.workspace }}/cobalt-build/src/out
          key: cobalt-src-${{ runner.os }}-${{ steps.versions.outputs.cobalt_ref }}
          restore-keys: |
            cobalt-src-${{ runner.os }}-

      - name: Clone and sync Cobalt
        working-directory: ${{ runner.workspace }}/cobalt-build
        run: |
          COBALT_REF="${{ steps.versions.outputs.cobalt_ref }}"
          mkdir -p src
          if [ -d "src/.git" ]; then
            CURRENT=$(cd src && git rev-parse HEAD 2>/dev/null || true)
            EXPECTED=$(cd src && git rev-parse "$COBALT_REF^{commit}" 2>/dev/null || true)
            if [ -n "$CURRENT" ] && [ "$CURRENT" = "$EXPECTED" ]; then
              echo "Cobalt source cache hit: $COBALT_REF ($CURRENT)"
              exit 0
            fi
          fi
          rm -rf src
          git clone --single-branch --branch "$COBALT_REF" --depth 1 \
            https://github.com/youtube/cobalt.git src
          cd src
          echo 'solutions = [{
            "name": "src",
            "url": "https://github.com/youtube/cobalt.git",
            "managed": false
          }]
          target_os = ["linux", "android"]' > ../.gclient
          gclient sync --no-history --shallow -r "$(git rev-parse @)"
        timeout-minutes: 50

      - name: Cache compiler output (ccache)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ steps.versions.outputs.cobalt_ref }}-${{ steps.config.outputs.platform }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.versions.outputs.cobalt_ref }}-

      - name: Build with Docker
        run: |
          PLATFORM="${{ steps.config.outputs.platform }}"
          BUILD_TYPE="${{ steps.config.outputs.build_type }}"
          COBALT_REF="${{ steps.versions.outputs.cobalt_ref }}"
          CONTAINER="ghcr.io/youtube/cobalt/cobalt-build-android:${COBALT_REF}"
          PKG="com.abstudios.cinelar.mediaclient"

          echo "Pulling Docker image: $CONTAINER"
          docker pull "$CONTAINER"

          docker run --rm \
            -v "${{ runner.workspace }}:/workspace" \
            -v "${{ runner.temp }}/ccache:/tmp/ccache" \
            -w /workspace/cobalt-build/src \
            -e ANDROID_HOME=/workspace/android-sdk \
            -e ANDROID_NDK_HOME=/workspace/android-sdk/ndk/26.1.10909125 \
            -e ANDROID_NDK_ROOT=/workspace/android-sdk/ndk/26.1.10909125 \
            -e NDK_HOME=/workspace/android-sdk/ndk/26.1.10909125 \
            -e CCACHE_DIR=/tmp/ccache \
            -e DEPOT_TOOLS_UPDATE=0 \
            -e PYTHONPATH=/workspace/cobalt-build/src \
            "$CONTAINER" /bin/bash -c "
              set -e
              export PATH=\"/workspace/depot_tools:/workspace/cobalt-build/src/third_party/ninja:\$PATH\"

              echo '=== Installing build deps ==='
              build/install-build-deps.sh || echo 'install-build-deps warning (non-fatal)'
              gclient runhooks || echo 'runhooks warning (non-fatal)'

              echo '=== Configuring ccache ==='
              ccache --max-size=15G
              ccache --zero-stats

              echo '=== Running GN config ==='
              python3 cobalt/build/gn.py -p '$PLATFORM' -c '$BUILD_TYPE' --no-rbe

              echo '=== Injecting optimized build args ==='
              cat >> out/${PLATFORM}_${BUILD_TYPE}/args.gn << 'GNARGS'
          symbol_level = 0
          v8_symbol_level = 0
          blink_symbol_level = 0
          is_official_build = true
          GNARGS

              echo 'android_package_name = \"$PKG\"' >> out/${PLATFORM}_${BUILD_TYPE}/args.gn
              echo 'cc_wrapper = \"ccache\"' >> out/${PLATFORM}_${BUILD_TYPE}/args.gn

              echo '=== Generating build files ==='
              gn gen out/${PLATFORM}_${BUILD_TYPE}

              echo '=== Building cobalt_loader ==='
              autoninja -C out/${PLATFORM}_${BUILD_TYPE} cobalt_loader

              echo '=== ccache stats ==='
              ccache --show-stats
            "
        timeout-minutes: 300

      - name: Verify build
        if: always()
        working-directory: ${{ runner.workspace }}/cobalt-build/src
        run: |
          PLATFORM="${{ steps.config.outputs.platform }}"
          BUILD_TYPE="${{ steps.config.outputs.build_type }}"
          BUILD_DIR="out/${PLATFORM}_${BUILD_TYPE}"
          echo "=== Build output ==="
          ls -lh "$BUILD_DIR/" 2>/dev/null || echo "No build output found"
          echo "=== APKs ==="
          ls -lh "$BUILD_DIR/apks/" 2>/dev/null || echo "No apks/ dir"
          for f in "$BUILD_DIR"/apks/*.apk; do
            [ -f "$f" ] && file "$f" && echo "  -> $(basename $f) OK"
          done

      - name: Decode keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
          echo "Keystore decoded successfully"

      - name: Sign APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PLATFORM="${{ steps.config.outputs.platform }}"
          BUILD_TYPE="${{ steps.config.outputs.build_type }}"
          BUILD_DIR="${{ runner.workspace }}/cobalt-build/src/out/${PLATFORM}_${BUILD_TYPE}"
          APK="$BUILD_DIR/apks/cobalt.apk"

          if [ ! -f "$APK" ]; then
            APK=$(find "$BUILD_DIR/apks/" -name "*.apk" | head -1)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "No APK found to sign"
            exit 1
          fi

          BUILD_TOOLS="${{ runner.workspace }}/android-sdk/build-tools/34.0.0"
          ALIGNED="${APK%.apk}-aligned.apk"
          SIGNED="${APK%.apk}-signed.apk"

          "$BUILD_TOOLS/zipalign" -v -p 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" "$ALIGNED"

          mv "$SIGNED" "$APK"
          rm -f "$ALIGNED"
          echo "APK signed successfully: $APK"

      - name: Package artifact
        run: |
          VERSION="${{ steps.version.outputs.app_version }}"
          PLATFORM="${{ steps.config.outputs.platform }}"
          BUILD_TYPE="${{ steps.config.outputs.build_type }}"
          BUILD_DIR="${{ runner.workspace }}/cobalt-build/src/out/${PLATFORM}_${BUILD_TYPE}"
          PACKAGE_DIR="build/tv/${PLATFORM}"
          mkdir -p "$PACKAGE_DIR"
          cp -r "$BUILD_DIR/apks/"*.apk "$PACKAGE_DIR/" 2>/dev/null || true
          cp -r "$BUILD_DIR/"*.so "$PACKAGE_DIR/" 2>/dev/null || true

          python3 -c "
          import json, os
          manifest = {
              'app_version': '$VERSION',
              'platform': '$PLATFORM',
              'build_type': '$BUILD_TYPE',
              'cobalt_version': '${{ steps.versions.outputs.cobalt_ref }}',
              'starboard_api': ${{ steps.versions.outputs.starboard_api }},
              'app_url': '${{ env.APP_URL }}',
              'package': '${{ env.COBALT_PACKAGE }}',
              'build_date': '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
              'commit': '${{ github.sha }}'
          }
          with open(os.path.join('$PACKAGE_DIR', 'manifest.json'), 'w') as f:
              json.dump(manifest, f, indent=2)
          "

          echo '#!/bin/bash' > "$PACKAGE_DIR/start.sh"
          echo 'set -e' >> "$PACKAGE_DIR/start.sh"
          echo 'SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"' >> "$PACKAGE_DIR/start.sh"
          echo 'APK=$(find "$SCRIPT_DIR" -name "*.apk" | head -1)' >> "$PACKAGE_DIR/start.sh"
          echo 'if [ -z "$APK" ]; then echo "ERROR: No APK found"; exit 1; fi' >> "$PACKAGE_DIR/start.sh"
          echo 'adb install -r "$APK"' >> "$PACKAGE_DIR/start.sh"
          echo 'adb shell am start --esa commandLineArgs "url=https://bigscreen.cinelartv.lat" com.abstudios.cinelar.mediaclient/com.abstudios.cinelar.mediaclient.MainActivity' >> "$PACKAGE_DIR/start.sh"
          chmod +x "$PACKAGE_DIR/start.sh"

          cd build
          tar -czf "tv-app-${PLATFORM}-${VERSION}.tar.gz" tv/${PLATFORM}/
          ls -lh "tv-app-${PLATFORM}-${VERSION}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-app-${{ steps.config.outputs.platform }}-${{ steps.version.outputs.app_version }}
          path: build/tv/${{ steps.config.outputs.platform }}/
          retention-days: 90

      - name: Create GitHub Release
        if: inputs.app_version != ''
        uses: softprops/action-gh-release@v2
        with:
          name: "TV App v${{ steps.version.outputs.app_version }} (${{ steps.config.outputs.platform }})"
          tag_name: "tv-v${{ steps.version.outputs.app_version }}"
          body: |
            ## TV App v${{ steps.version.outputs.app_version }}

            **Platform:** ${{ steps.config.outputs.platform }}
            **Cobalt:** ${{ steps.versions.outputs.cobalt_ref }}
            **Starboard API:** ${{ steps.versions.outputs.starboard_api }}
            **Build:** ${{ steps.config.outputs.build_type }}
            **Package:** ${{ env.COBALT_PACKAGE }}
            **App URL:** ${{ env.APP_URL }}

            ### Installation (Android TV)
            ```bash
            adb install -r cobalt.apk
            adb shell am start --esa commandLineArgs "url=${{ env.APP_URL }}" ${{ env.COBALT_PACKAGE }}/${{ env.COBALT_PACKAGE }}.MainActivity
            ```

            ${{ inputs.notes || '' }}
          files: build/tv-app-${{ steps.config.outputs.platform }}-${{ steps.version.outputs.app_version }}.tar.gz
          draft: false
          prerelease: false
